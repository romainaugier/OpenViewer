name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

  VCPKG_REPOSITORY: https://github.com/romainaugier/vcpkg.git
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            triplet: x64-linux
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            triplet: arm64-linux
          - name: macOS arm64
            os: macos-14
            triplet: arm64-osx
          - name: Windows x86_64
            os: windows-2022
            triplet: x64-windows

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: lukka/get-cmake@latest

    - name: Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk2.0-dev ninja-build
        if [ "$(uname -m)" = "x86_64" ]; then sudo apt-get install -y nasm; fi
        # No prebuilt vcpkg tools for arm64 linux: use the system cmake/ninja.
        if [ "$(uname -m)" = "aarch64" ]; then echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> $GITHUB_ENV; fi

    - name: macOS dependencies
      if: runner.os == 'macOS'
      run: brew install pkg-config ninja

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # vcpkg

    - name: Read the pinned vcpkg commit
      shell: bash
      run: echo "VCPKG_COMMIT=$(tr -d '[:space:]' < vcpkg.commit)" >> $GITHUB_ENV

    - name: Fetch vcpkg
      shell: bash
      run: |
        git init -q "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" remote add origin "$VCPKG_REPOSITORY"
        git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
        git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

    - name: Bootstrap vcpkg
      if: runner.os != 'Windows'
      shell: bash
      run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: '"%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics'

    - name: Restore the vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ matrix.triplet }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'ext/stdromano/vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.triplet }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.VCPKG_COMMIT }}-
          vcpkg-${{ matrix.triplet }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-
          vcpkg-${{ matrix.triplet }}-

    - name: Create the vcpkg binary cache directory
      run: cmake -E make_directory "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

    # stdromano

    - name: Build stdromano
      shell: bash
      run: |
        cmake -S ext/stdromano -B ext/stdromano/build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
              -DVERSION=0.0.0
        cmake --build ext/stdromano/build --config ${{ env.BUILD_TYPE }} --parallel
        cmake --install ext/stdromano/build --config ${{ env.BUILD_TYPE }} --prefix ext/stdromano/install

    # OpenViewer

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
              -DRUN_TESTS=1

    - name: Save the vcpkg binary cache
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
